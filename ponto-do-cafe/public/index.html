<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ponto do Café - Clientes</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #fff1f5 0%, #fce7f3 50%, #fdf2f8 100%);
            min-height: 100vh;
            padding: 40px 20px;
            color: #831843;
            line-height: 1.5;
        }

        .container {
            max-width: 860px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            padding: 36px;
            border-radius: 24px;
            box-shadow:
                0 10px 40px rgba(244, 114, 182, 0.15),
                0 0 0 1px rgba(251, 207, 232, 0.6);
        }

        h1 {
            color: #be185d;
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 6px;
            letter-spacing: -0.5px;
        }

        .subtitle {
            color: #db2777;
            font-size: 1rem;
            margin-bottom: 28px;
            opacity: 0.85;
        }

        h2 {
            color: #be185d;
            font-size: 1.25rem;
            font-weight: 600;
            margin: 32px 0 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        h2::before {
            content: "";
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #f472b6;
            border-radius: 50%;
        }

        form {
            display: grid;
            gap: 14px;
        }

        input {
            padding: 14px 18px;
            border: 2px solid #fbcfe8;
            border-radius: 16px;
            font-size: 15px;
            background-color: #fff1f5;
            color: #831843;
            transition: all 0.25s ease;
        }

        input::placeholder {
            color: #f9a8d4;
        }

        input:focus {
            outline: none;
            border-color: #f472b6;
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(244, 114, 182, 0.18);
        }

        button {
            padding: 14px 22px;
            border: none;
            border-radius: 16px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            background: linear-gradient(135deg, #f472b6, #ec4899);
            color: white;
            transition: all 0.25s ease;
            box-shadow: 0 4px 14px rgba(236, 72, 153, 0.3);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(236, 72, 153, 0.4);
            background: linear-gradient(135deg, #ec4899, #db2777);
        }

        button:active {
            transform: translateY(0);
        }

        .mensagem {
            margin-top: 16px;
            padding: 14px 18px;
            border-radius: 14px;
            display: none;
            font-weight: 500;
            font-size: 14px;
        }

        .sucesso {
            background-color: #fce7f3;
            color: #9d174d;
            border: 1px solid #f9a8d4;
        }

        .erro {
            background-color: #fff1f2;
            color: #be123c;
            border: 1px solid #fecdd3;
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            margin-top: 12px;
            border-radius: 16px;
            overflow: hidden;
            background: #fff;
            box-shadow: 0 2px 12px rgba(244, 114, 182, 0.08);
        }

        th {
            background: linear-gradient(135deg, #f9a8d4, #f472b6);
            color: white;
            padding: 14px 16px;
            text-align: left;
            font-weight: 600;
            font-size: 14px;
        }

        td {
            padding: 14px 16px;
            border-bottom: 1px solid #fce7f3;
            color: #831843;
            font-size: 14px;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            background-color: #fff1f5;
        }

        .botao-excluir {
            background: linear-gradient(135deg, #fb7185, #f43f5e);
            padding: 8px 14px;
            font-size: 13px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(244, 63, 94, 0.25);
        }

        .botao-excluir:hover {
            background: linear-gradient(135deg, #f43f5e, #e11d48);
            transform: translateY(-1px);
        }

        .vazio {
            text-align: center;
            padding: 32px 20px;
            color: #db2777;
            font-size: 15px;
        }

        .vazio::before {
            content: "🌸";
            display: block;
            font-size: 28px;
            margin-bottom: 8px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>☕ Ponto do Café</h1>
        <p class="subtitle">Sistema de gerenciamento de clientes</p>

        <h2>Cadastrar cliente</h2>

        <form id="formCliente">
            <input type="text" id="nome" placeholder="Nome completo" required>
            <input type="text" id="telefone" placeholder="Telefone" required>
            <input type="email" id="email" placeholder="E-mail" required>

            <button type="submit">
                Cadastrar cliente
            </button>
        </form>

        <div id="mensagem" class="mensagem"></div>

        <h2>Clientes cadastrados</h2>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>Telefone</th>
                    <th>E-mail</th>
                    <th>Ação</th>
                </tr>
            </thead>
            <tbody id="listaClientes">
            </tbody>
        </table>

    </div>

    <script>
        const form = document.getElementById("formCliente");
        const listaClientes = document.getElementById("listaClientes");
        const mensagem = document.getElementById("mensagem");

        function mostrarMensagem(texto, tipo) {
            mensagem.textContent = texto;
            mensagem.className = "mensagem " + tipo;
            mensagem.style.display = "block";

            setTimeout(() => {
                mensagem.style.display = "none";
            }, 3000);
        }

        async function carregarClientes() {
            const resposta = await fetch("/api/clientes");
            const clientes = await resposta.json();

            listaClientes.innerHTML = "";

            if (clientes.length === 0) {
                listaClientes.innerHTML = `
                <tr>
                    <td colspan="5" class="vazio">
                        Nenhum cliente cadastrado.
                    </td>
                </tr>
            `;
                return;
            }

            clientes.forEach(cliente => {
                const linha = document.createElement("tr");

                linha.innerHTML = `
                <td>${cliente.id}</td>
                <td>${cliente.nome}</td>
                <td>${cliente.telefone}</td>
                <td>${cliente.email}</td>
                <td>
                    <button
                        class="botao-excluir"
                        onclick="excluirCliente(${cliente.id})"
                    >
                        Excluir
                    </button>
                </td>
            `;

                listaClientes.appendChild(linha);
            });
        }

        form.addEventListener("submit", async function (evento) {
            evento.preventDefault();

            const nome = document.getElementById("nome").value;
            const telefone = document.getElementById("telefone").value;
            const email = document.getElementById("email").value;

            if (!nome.trim() || !telefone.trim() || !email.trim()) {
                mostrarMensagem("Preencha todos os campos.", "erro");
                return;
            }

            const resposta = await fetch("/api/clientes", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    nome,
                    telefone,
                    email
                })
            });

            const resultado = await resposta.json();

            if (resposta.ok) {
                mostrarMensagem("Cliente cadastrado com sucesso!", "sucesso");
                form.reset();
                carregarClientes();
            } else {
                mostrarMensagem(resultado.erro, "erro");
            }
        });

        async function excluirCliente(id) {
            const confirmacao = confirm(
                `Tem certeza que deseja excluir o cliente de ID ${id}?`
            );

            if (!confirmacao) return;

            const resposta = await fetch(`/api/clientes/${id}`, {
                method: "DELETE"
            });

            const resultado = await resposta.json();

            if (resposta.ok) {
                mostrarMensagem("Cliente excluído com sucesso!", "sucesso");
                carregarClientes();
            } else {
                mostrarMensagem(resultado.erro, "erro");
            }
        }

        carregarClientes();
    </script>

</body>

</html>
