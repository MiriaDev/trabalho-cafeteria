<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ponto do Café - Clientes</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;

            background:
                radial-gradient(circle at 10% 15%, rgba(255, 182, 219, 0.45), transparent 25%),
                radial-gradient(circle at 90% 85%, rgba(244, 114, 182, 0.25), transparent 25%),
                linear-gradient(135deg, #fff5fa, #ffe4f0, #fff0f7);

            min-height: 100vh;
            padding: 45px 20px;

            color: #702044;
            line-height: 1.5;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;

            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(16px);

            padding: 38px;
            border-radius: 28px;

            border: 2px solid rgba(255, 182, 219, 0.55);

            box-shadow:
                0 20px 50px rgba(190, 24, 93, 0.12),
                0 0 0 6px rgba(255, 255, 255, 0.45);
        }

        h1 {
            color: #d63384;
            font-size: 2.2rem;
            font-weight: 750;
            margin-bottom: 5px;
            letter-spacing: -0.8px;

            text-shadow:
                2px 2px 0 #ffd6e8;
        }

        h1::after {
            content: " ✦";
            color: #f472b6;
            font-size: 1.2rem;
        }

        .subtitle {
            color: #a83c70;
            font-size: 0.98rem;
            margin-bottom: 30px;
            opacity: 0.85;
        }

        h2 {
            color: #c0266c;
            font-size: 1.25rem;
            font-weight: 700;
            margin: 32px 0 16px;

            display: flex;
            align-items: center;
            gap: 9px;
        }

        h2::before {
            content: "♡";
            color: #ec4899;
            font-size: 1.1rem;
        }

        form {
            display: grid;
            gap: 13px;
        }

        input {
            width: 100%;
            padding: 15px 18px;

            border: 2px solid #fbcfe8;
            border-radius: 15px;

            font-size: 15px;

            background: #fff8fb;
            color: #702044;

            transition: 0.25s ease;

            box-shadow:
                inset 0 1px 3px rgba(190, 24, 93, 0.04);
        }

        input::placeholder {
            color: #d889ac;
        }

        input:focus {
            outline: none;
            border-color: #ec4899;
            background: #ffffff;

            box-shadow:
                0 0 0 4px rgba(236, 72, 153, 0.12),
                0 4px 12px rgba(236, 72, 153, 0.08);
        }

        form button {
            padding: 15px 22px;

            border: none;
            border-radius: 15px;

            cursor: pointer;

            font-size: 15px;
            font-weight: 700;

            background:
                linear-gradient(
                    135deg,
                    #f9a8d4,
                    #ec4899,
                    #d63384
                );

            color: white;

            transition: 0.25s ease;

            box-shadow:
                0 6px 16px rgba(236, 72, 153, 0.25);
        }

        form button::before {
            content: "♡ ";
        }

        form button:hover {
            transform: translateY(-2px);

            box-shadow:
                0 9px 22px rgba(236, 72, 153, 0.35);
        }

        form button:active {
            transform: translateY(0);
        }

        .mensagem {
            margin-top: 16px;
            padding: 14px 18px;
            border-radius: 15px;

            display: none;

            font-weight: 600;
            font-size: 14px;
        }

        .sucesso {
            background: #fff0f7;
            color: #a21caf;

            border: 1px solid #f9a8d4;

            box-shadow:
                0 4px 12px rgba(236, 72, 153, 0.08);
        }

        .erro {
            background: #fff1f2;
            color: #be123c;
            border: 1px solid #fecdd3;
        }

        table {
            width: 100%;

            border-collapse: separate;
            border-spacing: 0;

            margin-top: 12px;

            border-radius: 18px;
            overflow: hidden;

            background: #ffffff;

            border: 1px solid #fbcfe8;

            box-shadow:
                0 7px 20px rgba(190, 24, 93, 0.08);
        }

        th {
            background:
                linear-gradient(
                    135deg,
                    #f9a8d4,
                    #ec4899
                );

            color: white;

            padding: 15px 16px;

            text-align: left;

            font-weight: 700;
            font-size: 14px;
        }

        td {
            padding: 14px 16px;

            border-bottom: 1px solid #fce7f3;

            color: #702044;

            font-size: 14px;

            background: #fff;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            background: #fff5fa;
        }

        .botao-excluir {
            background:
                linear-gradient(
                    135deg,
                    #fb7185,
                    #ec4899
                );

            padding: 8px 14px;

            font-size: 13px;
            font-weight: 600;

            border-radius: 11px;

            border: none;

            color: white;

            cursor: pointer;

            box-shadow:
                0 3px 9px rgba(236, 72, 153, 0.2);

            transition: 0.2s ease;
        }

        .botao-excluir::before {
            content: "♡ ";
        }

        .botao-excluir:hover {
            background:
                linear-gradient(
                    135deg,
                    #f43f5e,
                    #d63384
                );

            transform: translateY(-1px);

            box-shadow:
                0 5px 12px rgba(236, 72, 153, 0.3);
        }

        .vazio {
            text-align: center;

            padding: 38px 20px;

            color: #c0266c;

            font-size: 15px;

            background:
                linear-gradient(
                    135deg,
                    #fffafd,
                    #fff1f7
                );
        }

        .vazio::before {
            content: "🌸";

            display: block;

            font-size: 30px;

            margin-bottom: 8px;
        }

        @media (max-width: 700px) {

            body {
                padding: 20px 10px;
            }

            .container {
                padding: 25px 18px;
                border-radius: 22px;
            }

            h1 {
                font-size: 1.8rem;
            }

            table {
                display: block;
                overflow-x: auto;
                white-space: nowrap;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>☕ Ponto do Café</h1>

        <p class="subtitle">
            Sistema de gerenciamento de clientes
        </p>

        <h2>Cadastrar cliente</h2>

        <form id="formCliente">

            <input
                type="text"
                id="nome"
                placeholder="Nome completo"
                required
            >

            <input
                type="text"
                id="telefone"
                placeholder="Telefone"
                required
            >

            <input
                type="email"
                id="email"
                placeholder="E-mail"
                required
            >

            <button type="submit">
                Cadastrar cliente
            </button>

        </form>

        <div id="mensagem" class="mensagem"></div>

        <h2>Clientes cadastrados</h2>

        <table>

            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>Telefone</th>
                    <th>E-mail</th>
                    <th>Ação</th>
                </tr>
            </thead>

            <tbody id="listaClientes"></tbody>

        </table>

    </div>

    <script>

        const form = document.getElementById("formCliente");
        const listaClientes = document.getElementById("listaClientes");
        const mensagem = document.getElementById("mensagem");

        function mostrarMensagem(texto, tipo) {

            mensagem.textContent = texto;
            mensagem.className = "mensagem " + tipo;
            mensagem.style.display = "block";

            setTimeout(() => {
                mensagem.style.display = "none";
            }, 3000);
        }

        async function carregarClientes() {

            const resposta = await fetch("/api/clientes");
            const clientes = await resposta.json();

            listaClientes.innerHTML = "";

            if (clientes.length === 0) {

                listaClientes.innerHTML = `
                    <tr>
                        <td colspan="5" class="vazio">
                            Nenhum cliente cadastrado.
                        </td>
                    </tr>
                `;

                return;
            }

            clientes.forEach(cliente => {

                const linha = document.createElement("tr");

                linha.innerHTML = `
                    <td>${cliente.id}</td>
                    <td>${cliente.nome}</td>
                    <td>${cliente.telefone}</td>
                    <td>${cliente.email}</td>

                    <td>
                        <button
                            class="botao-excluir"
                            onclick="excluirCliente(${cliente.id})"
                        >
                            Excluir
                        </button>
                    </td>
                `;

                listaClientes.appendChild(linha);
            });
        }

        form.addEventListener("submit", async function (evento) {

            evento.preventDefault();

            const nome = document.getElementById("nome").value;
            const telefone = document.getElementById("telefone").value;
            const email = document.getElementById("email").value;

            if (!nome.trim() || !telefone.trim() || !email.trim()) {

                mostrarMensagem(
                    "Preencha todos os campos.",
                    "erro"
                );

                return;
            }

            const resposta = await fetch("/api/clientes", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    nome,
                    telefone,
                    email
                })
            });

            const resultado = await resposta.json();

            if (resposta.ok) {

                mostrarMensagem(
                    "Cliente cadastrado com sucesso!",
                    "sucesso"
                );

                form.reset();

                carregarClientes();

            } else {

                mostrarMensagem(
                    resultado.erro,
                    "erro"
                );
            }
        });

        async function excluirCliente(id) {

            const confirmacao = confirm(
                `Tem certeza que deseja excluir o cliente de ID ${id}?`
            );

            if (!confirmacao) return;

            const resposta = await fetch(`/api/clientes/${id}`, {

                method: "DELETE"

            });

            const resultado = await resposta.json();

            if (resposta.ok) {

                mostrarMensagem(
                    "Cliente excluído com sucesso!",
                    "sucesso"
                );

                carregarClientes();

            } else {

                mostrarMensagem(
                    resultado.erro,
                    "erro"
                );
            }
        }

        carregarClientes();

    </script>

</body>
</html>
